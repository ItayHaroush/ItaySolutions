<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChefSyncIL - דף מעבר</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      overflow: hidden;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1.5s ease;
    }
    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
      margin-bottom: 24px;
      animation: popIn 1.2s cubic-bezier(.68,-0.55,.27,1.55);
      overflow: hidden;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
    .logo-text {
      color: #fff;
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-family: 'Varela Round', 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }
    .subtitle {
      color: #333;
      font-size: 1.2rem;
      margin-top: 8px;
      opacity: 0.8;
      letter-spacing: 1px;
    }
    .main-link {
      font-size: 1.2rem;
      margin-top: 24px;
      color: #007BFF;
      text-decoration: none;
      transition: color 0.2s;
      font-weight: bold;
    }
    .main-link:hover {
      color: #0056b3;
      text-decoration: underline;
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (max-width: 600px) {
      .logo {
        width: 90px;
        height: 90px;
      }
      .logo-text {
        font-size: 1.5rem;
      }
      .subtitle {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo" id="logoBox">
      <!-- אם יש לוגו קובץ, נציג אותו, אחרת טקסט -->
    </div>
    <div class="subtitle">ברוכים הבאים</div>
    <a class="main-link" href="https://tefenorders.great-site.net/landingPage.php" target="_blank" rel="noopener noreferrer">מעבר לאתר הראשי</a>
  </div>
  <script>
    // ננסה להציג לוגו קובץ אם קיים, אחרת טקסט
    const logoBox = document.getElementById('logoBox');
    const img = new Image();
    img.src = 'assets/images/ChefSyncIL.png';
    img.alt = 'ChefSync IL Logo';
    img.onload = function() {
      logoBox.appendChild(img);
    };
    img.onerror = function() {
      const span = document.createElement('span');
      span.className = 'logo-text';
      span.textContent = 'ChefSyncIL';
      logoBox.appendChild(span);
    };
  </script>
</body>
</html>
